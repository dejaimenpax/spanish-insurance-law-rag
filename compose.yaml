# `docker compose up` starts Qdrant, runs an incremental ingestion of the BOE texts, then the API
# and UI on http://localhost:8000. The first run downloads the texts and the models and embeds
# about 2,500 chunks on CPU (see README); later runs only re-index what the BOE changed.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: spanish-insurance-law-rag:latest
    command: ["insurance-rag", "ingest"]
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - models:/models
    depends_on:
      qdrant:
        condition: service_healthy

  api:
    image: spanish-insurance-law-rag:latest
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - models:/models
    depends_on:
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

volumes:
  qdrant-data:
  models:
