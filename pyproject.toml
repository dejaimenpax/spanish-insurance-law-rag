[project]
name = "insurance-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over Spanish insurance law, with article-level citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaime González Casero" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.27.2",
]

[project.scripts]
insurance-rag = "insurance_rag.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "ANN", "S", "PTH", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: hits live external services (deselected in CI)",
    "integration: needs Docker services such as Qdrant",
]
addopts = "-m 'not network and not integration'"
