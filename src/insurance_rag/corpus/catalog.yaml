# Norms indexed by the assistant. Texts are downloaded at ingestion time, never versioned.
#
# For norms that approve a consolidated text or a regulation ("por el que se aprueba el texto
# refundido / el Reglamento ..."), only the approved text is indexed: the approving instrument's
# single article and formal provisions are skipped (see docs/decisions/0001-corpus-scope.md).

norms:
  # --- Insurance contract and distribution -------------------------------------------------
  - id: BOE-A-1980-22501
    short_name: LCS
    title: Ley 50/1980, de 8 de octubre, de Contrato de Seguro
    aliases: ["Ley 50/1980", "Ley de Contrato de Seguro"]
    rank: ley
    jurisdiction: ES
    legal_effect: national
    topics: [contrato]

  - id: BOE-A-2020-1651
    short_name: RDL 3/2020
    title: >-
      Real Decreto-ley 3/2020, de 4 de febrero (Libro segundo, título I: distribución de seguros
      y reaseguros privados)
    aliases: ["Real Decreto-ley 3/2020", "RDL 3/2020", "RDL de distribución de seguros"]
    rank: real_decreto_ley
    jurisdiction: ES
    legal_effect: national
    topics: [distribucion]
    scope:
      from_block: ls # LIBRO SEGUNDO
      until_block: ti-6 # TÍTULO II of book two (pension funds), excluded
      extra_blocks:
        - da-11 # Fee for registration in the register of insurance distributors
        - da-12 # Training programmes for distributors
        - da-13 # Retention of pre-contractual documentation
        - dt-2 # Transitional regime for insurance undertakings
        - dt-3 # Transitional regime for insurance intermediaries
        - dt-4 # Book two, title I does not apply to pre-existing contracts
        - dt-5 # Mediation and distribution agreements in force
        - df-10 # Ley 20/2015 applies on a supplementary basis
        - df-15 # Competence requirements for employees involved in distribution
        - ax-3 # ANEXO XII: minimum professional competence and knowledge requirements
    scope_rationale: >-
      Only book two, title I (insurance and reinsurance distribution) is in scope. Final-part
      provisions were included when their content concerns insurance distribution; final
      provision 7.2 of the norm itself lists the ones enacted under the insurance competences.

